<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TILT MAZE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!--
  ============================================================
   勉強会(1)  ゲーム画面を作る
  ============================================================

   このファイルには構造だけを書く。色や大きさは style.css に書く。
   HTML と CSS で役割を分けるのが基本で、混ぜない。


   上の <head> について

     ページ本体ではなく設定を書く場所。中身は毎回ほぼ同じ。

       meta charset    文字コードの指定。ないと日本語が化ける
       meta viewport   スマホで等倍表示する。ないと縮小されて表示される
       title           ブラウザのタブに出る名前
       link            style.css を読み込む

     VSCode では、空の .html ファイルで ! を打って Tab を押すと
     この骨組みが生成される。手で覚える必要はない。


   進め方

     STEP 1 から順に、この <body> の中にタグを書いていく。
     保存して（Ctrl+S）、ブラウザを再読み込み（F5）すると反映される。

   ============================================================


   ------------------------------------------------------------
    STEP 1   見出しを出す
   ------------------------------------------------------------
    h1 は見出しを表すタグ。開始タグと終了タグで文字を挟む。

        <h1>TILT MAZE</h1>

    タイトルは自分で決めてよい。
    決めたら <head> の <title> も同じ名前に直しておく。

    確認: 大きな文字が表示される。


   ------------------------------------------------------------
    STEP 2   タイマーの表示場所を作る
   ------------------------------------------------------------
    p は段落を表すタグ。
    id はその要素に付ける名前で、ページ内で重複させない。
    あとで CSS と JavaScript から、この名前で要素を指定する。

        <p id="timer">00.0</p>

    確認: 00.0 と表示される。


   ------------------------------------------------------------
    STEP 3   盤と玉を作る
   ------------------------------------------------------------
    div は「意味を持たない入れ物」を作るタグ。
    ここでは盤を1つ作り、その中に玉を入れる。

        <div id="board">
          <div id="ball"></div>
        </div>

    タグの中にタグを入れることを入れ子という。
    中に入れた要素は、外側の要素の中に配置される。

    確認: 何も表示されない。
          div は中身も大きさも指定されていないと見えないため。
          これは正常。STEP 7 以降の CSS で見えるようにする。


   ------------------------------------------------------------
    STEP 4   ボタンを置く
   ------------------------------------------------------------
    button タグを使う。id は startBtn とする。
    書き方は STEP 2 の p を参考にする。

    確認: 押せるボタンが表示される。押しても何も起きない。


   ------------------------------------------------------------
    STEP 5   説明文を置く
   ------------------------------------------------------------
    操作方法を書いた段落を1つ足す。
    id ではなく class="note" を付ける。

    id は1ページに1つだけの名前、class は複数の要素に付けられる名前。
    説明文が今後増える可能性があるので class を使う。

    確認: 説明文が表示される。


   ============================================================

    ここまでで HTML は完成。
    文字が縦に並んだだけの素っ気ない見た目になっているはずで、
    それが正しい状態。

    HTML は構造だけを担当し、見た目は一切持たない。
    ここから style.css に移る。

   ============================================================
-->

</body>
</html>
